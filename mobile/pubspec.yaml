name: makeable_jobs
description: "Makeable Jobs - One Search. Every Opportunity. A job aggregation platform."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Networking
  dio: ^5.7.0

  # Firebase push notifications
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5

  # Local storage
  shared_preferences: ^2.3.4

  # Caching / images
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1

  # Fonts
  google_fonts: ^6.2.1

  # External links
  url_launcher: ^6.3.1

  # Utility
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "../job-search.png"